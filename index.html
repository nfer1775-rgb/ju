<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09070d">
  <title>THE COOKIE</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow: hidden; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; background: #08070a; color: #eee8e1; }
    .intro { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #24202a, #09080d 70%); }
    .intro::after { content:""; position:absolute; inset:-50%; opacity:.12; background: repeating-radial-gradient(circle, #fff 0 1px, transparent 1px 5px); animation: static 0.12s steps(2) infinite; }
    .panel { position:relative; z-index:2; width:min(520px, calc(100vw - 32px)); padding:42px 36px; text-align:center; border:1px solid #ffffff18; border-radius:4px; background:#111016d9; box-shadow:0 35px 100px #000b; }
    h1 { margin:0 0 12px; font-size:clamp(40px, 11vw, 76px); line-height:.82; letter-spacing:.02em; text-transform:uppercase; }
    .red { color:#b11c24; text-shadow:0 0 22px #e51b24aa; }
    p { margin:18px auto 28px; max-width:390px; font-family:Georgia, serif; font-size:16px; line-height:1.6; color:#aca5a9; }
    .button { position:relative; width:100%; height:68px; border:1px solid #caaea0; border-radius:2px; cursor:pointer; background:#e7ddd2; color:#120e12; font:900 20px Georgia, serif; letter-spacing:.04em; box-shadow:0 10px 0 #6d6060, 0 24px 50px #0008; transition:.12s; }
    .button:hover { background:#fff8ef; transform:translateY(-2px); box-shadow:0 12px 0 #6d6060, 0 28px 60px #000a; }
    .button:active { transform:translateY(8px); box-shadow:0 2px 0 #6d6060; }

    .jumpscare { position:fixed; z-index:10; inset:0; display:none; place-items:center; overflow:hidden; background:#020103; }
    .jumpscare.active { display:grid; }
    .jumpscare::before { content:""; position:absolute; z-index:5; inset:-30%; pointer-events:none; opacity:.22; background:repeating-linear-gradient(0deg, transparent 0 3px, #fff 4px 5px); animation:flicker .08s steps(2) infinite; }
    .jumpscare::after { content:""; position:absolute; z-index:6; inset:0; pointer-events:none; box-shadow:inset 0 0 110px 42px #000, inset 0 0 260px 100px #200006; }

    .creature { position:absolute; width:min(96vw, 900px); height:min(96vh, 900px); transform:scale(.08) rotate(-8deg); filter:contrast(1.25) drop-shadow(0 0 34px #970006); }
    .active .creature { animation:attack .48s cubic-bezier(.1,.7,.1,1) forwards, shake .07s .48s infinite; }
    .skin { fill:#3b080c; stroke:#100205; stroke-width:22; }
    .skin-light { fill:#8f1719; }
    .crack { fill:none; stroke:#160104; stroke-width:13; stroke-linecap:round; }
    .eye { fill:#f1dfbb; stroke:#1b0205; stroke-width:16; }
    .pupil { fill:#09090a; }
    .mouth { fill:#090206; stroke:#160204; stroke-width:18; }
    .tooth { fill:#e7dcc7; stroke:#24130f; stroke-width:5; }
    .tongue { fill:#a41320; }

    .scream { position:absolute; z-index:8; top:3%; width:100%; margin:0; text-align:center; color:#fff; font-size:clamp(44px, 13vw, 150px); line-height:.8; letter-spacing:-.04em; text-transform:uppercase; text-shadow:7px 7px #79000a, -4px -4px #b42d32, 0 0 38px #e1161e; animation:word .11s steps(2) infinite alternate; }
    .controls { position:absolute; z-index:20; bottom:24px; display:flex; gap:10px; }
    .control { min-height:48px; padding:0 18px; border:1px solid #ffffff75; border-radius:999px; cursor:pointer; background:#08070ad9; color:#fff; font:700 15px Georgia, serif; backdrop-filter:blur(8px); }
    .control:hover { background:#501018; }

    @keyframes attack { 0%{transform:scale(.08) rotate(-8deg)} 55%{transform:scale(1.22) rotate(4deg)} 75%{transform:scale(.86) rotate(-3deg)} 100%{transform:scale(1.04) rotate(0)} }
    @keyframes shake { 0%,100%{margin:0} 25%{margin:-6px 0 0 8px} 50%{margin:5px -8px 0 0} 75%{margin:-3px 0 0 -7px} }
    @keyframes flicker { 0%{transform:translateY(-3%) scaleY(1)} 100%{transform:translateY(3%) scaleY(.96)} }
    @keyframes word { from{transform:skewX(-4deg) scaleX(.94)} to{transform:skewX(5deg) scaleX(1.06)} }
    @keyframes static { 0%{transform:translate(2%,2%)} 25%{transform:translate(-2%,3%)} 50%{transform:translate(3%,-2%)} 75%{transform:translate(-3%,-3%)} }
    @media (max-width:600px) { .panel{padding:34px 20px}.controls{bottom:14px}.control{padding:0 12px;font-size:13px}.creature{width:112vw;height:112vw} }
    @media (prefers-reduced-motion: reduce) { .intro::after,.jumpscare::before,.active .creature,.scream{animation-duration:.01ms!important;animation-iteration-count:1!important} }
  </style>
</head>
<body>
  <main class="intro" id="intro">
    <section class="panel">
      <h1>THE<br><span class="red">COOKIE</span></h1>
      <p>It has been waiting beneath the crumbs. It remembers every cookie you ever ate.</p>
      <button class="button" id="accept">TAKE ONE</button>
    </section>
  </main>

  <section class="jumpscare" id="jumpscare" role="dialog" aria-modal="true" aria-label="The cookie has awakened" aria-hidden="true">
    <p class="scream">RUN</p>
    <svg class="creature" viewBox="0 0 800 800" aria-hidden="true">
      <defs><filter id="rough"><feTurbulence baseFrequency=".018" numOctaves="3" seed="8" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="12"/></filter></defs>
      <g filter="url(#rough)">
        <path class="skin" d="M400 38 C610 42 734 181 757 382 C778 590 640 744 450 770 C257 796 98 701 55 519 C10 323 122 111 314 53Z"/>
        <path class="skin-light" d="M400 103 C559 108 670 205 684 372 C701 544 606 653 464 681 C314 711 187 638 145 499 C99 348 177 175 400 103Z" opacity=".72"/>
        <path class="crack" d="M400 112L380 180 410 221 376 271"/><path class="crack" d="M190 238l70 48-24 53 54 46"/><path class="crack" d="M637 229l-63 54 27 62-55 43"/><path class="crack" d="M262 607l70-44 35 73"/><path class="crack" d="M569 623l-53-51-35 78"/>
        <ellipse class="eye" cx="285" cy="330" rx="123" ry="146" transform="rotate(-8 285 330)"/><ellipse class="eye" cx="532" cy="326" rx="123" ry="146" transform="rotate(8 532 326)"/>
        <ellipse class="pupil" cx="302" cy="353" rx="35" ry="62"/><ellipse class="pupil" cx="514" cy="349" rx="35" ry="62"/>
        <ellipse cx="315" cy="334" rx="9" ry="12" fill="#fff"/><ellipse cx="527" cy="330" rx="9" ry="12" fill="#fff"/>
        <path class="mouth" d="M155 520 C181 420 310 424 402 497 C494 424 619 421 648 522 C675 619 596 714 404 732 C211 714 130 620 155 520Z"/>
        <path class="tongue" d="M283 668 C323 616 490 616 535 672 C496 716 329 724 283 668Z"/>
        <g class="tooth">
          <path d="M177 545l74-31-8 93-62-12z"/><path d="M256 500l81-25-18 97-75-2z"/><path d="M338 478l66 18-25 87-69-12z"/><path d="M410 499l66-23 20 100-68 15z"/><path d="M476 479l75 26-16 74-72 3z"/><path d="M552 503l75 37-18 54-61-13z"/>
          <path d="M210 659l72-25 15 74-66-5z"/><path d="M300 646l72-17 17 91-82-17z"/><path d="M405 628l72 15-6 84-68 12z"/><path d="M493 633l76 20-22 51-70 7z"/>
        </g>
        <circle cx="159" cy="248" r="33" fill="#160204"/><circle cx="650" cy="280" r="42" fill="#160204"/><circle cx="620" cy="695" r="28" fill="#160204"/><circle cx="190" cy="705" r="36" fill="#160204"/><circle cx="710" cy="449" r="24" fill="#160204"/><circle cx="114" cy="425" r="27" fill="#160204"/>
      </g>
    </svg>
    <div class="controls">
      <button class="control" id="again">AGAIN</button>
      <button class="control" id="mute" aria-pressed="true">MUTE</button>
      <button class="control" id="close">ESCAPE</button>
    </div>
  </section>

  <script>
    (()=>{
      const stage=document.getElementById('jumpscare'), accept=document.getElementById('accept'), mute=document.getElementById('mute');
      let ctx, master, noiseGain, noiseTimer, drone, muted=false;

      async function initAudio(){
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)return;
        if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.7;master.connect(ctx.destination)}
        if(ctx.state==='suspended')await ctx.resume();
      }
      function screamSound(){
        if(!ctx||muted)return;
        const now=ctx.currentTime;
        const buffer=ctx.createBuffer(1,ctx.sampleRate*1.25,ctx.sampleRate), data=buffer.getChannelData(0);
        for(let i=0;i<data.length;i++){const t=i/data.length;data[i]=(Math.random()*2-1)*Math.pow(1-t,.35)}
        const source=ctx.createBufferSource();source.buffer=buffer;
        const filter=ctx.createBiquadFilter();filter.type='bandpass';filter.frequency.setValueAtTime(700,now);filter.frequency.exponentialRampToValueAtTime(4200,now+.12);filter.frequency.exponentialRampToValueAtTime(600,now+1.2);filter.Q.value=1.2;
        noiseGain=ctx.createGain();noiseGain.gain.setValueAtTime(.001,now);noiseGain.gain.exponentialRampToValueAtTime(.9,now+.025);noiseGain.gain.exponentialRampToValueAtTime(.001,now+1.22);
        source.connect(filter).connect(noiseGain).connect(master);source.start(now);
        drone=ctx.createOscillator();const dg=ctx.createGain();drone.type='sawtooth';drone.frequency.setValueAtTime(72,now);drone.frequency.exponentialRampToValueAtTime(38,now+1.4);dg.gain.setValueAtTime(.0001,now);dg.gain.exponentialRampToValueAtTime(.32,now+.03);dg.gain.exponentialRampToValueAtTime(.0001,now+1.5);drone.connect(dg).connect(master);drone.start(now);drone.stop(now+1.5);
      }
      async function show(){await initAudio();stage.classList.remove('active');void stage.offsetWidth;stage.classList.add('active');stage.setAttribute('aria-hidden','false');document.body.style.animation='none';screamSound();document.getElementById('again').focus()}
      function close(){stage.classList.remove('active');stage.setAttribute('aria-hidden','true');accept.focus()}
      accept.addEventListener('click',show);document.getElementById('again').addEventListener('click',show);document.getElementById('close').addEventListener('click',close);
      mute.addEventListener('click',()=>{muted=!muted;mute.textContent=muted?'UNMUTE':'MUTE';mute.setAttribute('aria-pressed',String(!muted);if(master&&!muted)master.gain.setTargetAtTime(.7,ctx.currentTime,.03);if(master&&muted)master.gain.setTargetAtTime(.0001,ctx.currentTime,.03)});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('active'))close()});
    })();
  </script>
</body>
</html>
